<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Krishivaas Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    display: flex; height: 100vh; overflow: hidden;
    background: #EAEDDF; color: #2B2620;
  }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 240px; flex-shrink: 0; height: 100%;
    background: #384A32; color: #EAEDDF;
    display: flex; flex-direction: column;
    padding: 20px 14px; gap: 6px;
  }
  .brand {
    font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 1.15rem;
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px 14px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 8px;
  }
  .brand small { display: block; font-family: 'Inter', sans-serif; font-weight: 400; font-size: 0.68rem; color: #B7C4AC; margin-top: 2px; }
  .navlabel { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.08em; color: #8FA383; padding: 8px 10px 4px; }
  .navitem {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: transparent; border: none; color: #DDE4D3;
    font-family: inherit; font-size: 0.9rem; text-align: left;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .navitem:hover { background: rgba(255,255,255,0.07); }
  .navitem.active { background: #6E8F4E; color: #fff; font-weight: 500; }
  .navitem .ico { font-size: 1.05rem; }
  .sidebar-foot { margin-top: auto; font-size: 0.66rem; color: #8FA383; padding: 10px; line-height: 1.5; }

  /* ---- Content ---- */
  .content { flex: 1; height: 100%; position: relative; }
  .content iframe { width: 100%; height: 100%; border: 0; display: block; background: #EAEDDF; }

  @media (max-width: 720px) {
    body { flex-direction: column; overflow: auto; }
    .sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px; }
    .brand { border: none; margin: 0 12px 0 4px; padding: 0; font-size: 1rem; }
    .brand small { display: none; }
    .navlabel, .sidebar-foot { display: none; }
    .navitem { width: auto; }
    .content { height: calc(100vh - 56px); }
  }
</style>
</head>
<body>
  <nav class="sidebar">
    <div class="brand">
      🌾 <div>Krishivaas Tools<small>local toolkit</small></div>
    </div>
    <div class="navlabel">Tools</div>
    <button class="navitem active" data-src="allocation.html" id="nav-allocation">
      <span class="ico">🌱</span> Crop Allocation
    </button>
    <button class="navitem" data-src="tree-count.html" id="nav-tree">
      <span class="ico">🌴</span> Tree Count Checker
    </button>
    <button class="navitem" data-src="health-check.html" id="nav-health">
      <span class="ico">🩺</span> Crop / Tree Health
    </button>
    <div class="sidebar-foot">
      Runs locally · all API calls go server-to-server (no CORS).
    </div>
  </nav>

  <main class="content">
    <iframe id="frame" src="allocation.html" title="tool"></iframe>
  </main>

<script>
  const frame = document.getElementById('frame');
  const items = Array.from(document.querySelectorAll('.navitem'));

  function activate(src) {
    items.forEach((b) => b.classList.toggle('active', b.dataset.src === src));
    if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
    // reflect in the URL hash so a reload keeps the tab
    const key = src.replace('.html', '');
    if (location.hash !== '#' + key) history.replaceState(null, '', '#' + key);
  }

  items.forEach((b) => b.addEventListener('click', () => activate(b.dataset.src)));

  // restore tab from hash on load (#allocation / #tree-count / #health-check)
  const initial = location.hash.slice(1);
  const match = items.find((b) => b.dataset.src === initial + '.html');
  activate(match ? match.dataset.src : 'allocation.html');
</script>
</body>
</html>
